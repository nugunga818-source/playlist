<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>플리 창고</title>
<link rel="stylesheet" href="fonts/do-hyeon.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2340d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="플리 창고">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* VOICE everyday — a personal listening tool for a tablet, warm but precise
   IDEA a record shop: the 창고 is a crate of record sleeves, the deck is a turntable on a cobalt plinth
   PICTURE the record spinning with the track's own cover as its label; a screen on the plinth for MP4
   COLOUR white ground, cobalt deck field, coral accent for play and progress, sleeve colours from each track
   TYPE Do Hyeon display + Noto Sans KR text
   LAYOUT wide: sidebar | home/crate | deck; tablet portrait: content | deck; phone: content + mini bar, deck slides up */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0c0e16);--ink:light-dark(#151722,#eef0f7);--mute:light-dark(#5f6474,#9ca2b5);--line:light-dark(#e4e6ee,#252a3a);--side:light-dark(#f2f4fa,#11141f);--soft:light-dark(#e9edff,#19214a);--pri:light-dark(#2340d9,#7088ff);--deck:light-dark(#2340d9,#16248a);--plate:light-dark(#2f4ce8,#1e2ea0);--hot:#ff5a3c;--danger:light-dark(#c8321c,#ff7a62);--onpri:#fff;--onhot:#fff}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
:root[data-mode=vocalo]{color-scheme:dark;--bg:#0b0f1f;--ink:#e6fbff;--mute:#8db4c3;--line:#1d2a47;--side:#111934;--soft:#0f3441;--pri:#39c5bb;--onpri:#03181c;--deck:#0a3843;--plate:#0e4e5b;--hot:#ff4fa3;--onhot:#fff;--danger:#ff6b8b}
:root[data-mode=vocalo] #deck{background-image:linear-gradient(#ffffff0e 1px,transparent 1px),linear-gradient(90deg,#ffffff0e 1px,transparent 1px);background-size:22px 22px}
:root[data-mode=vocalo] .big{box-shadow:0 0 0 6px #ff4fa333,0 0 28px #ff4fa3aa}
:root[data-mode=vocalo] .lab{box-shadow:0 0 0 3px #0b0c10,0 0 18px #39c5bb88}
:root[data-mode=study]{color-scheme:light;--bg:#f3f4ef;--ink:#1e2925;--mute:#5a6862;--line:#dde2d8;--side:#e8ebe3;--soft:#dfeae3;--pri:#2f6b57;--onpri:#fff;--deck:#26453b;--plate:#2f5649;--hot:#e3a63b;--onhot:#1e2925;--danger:#b4452f}
:root[data-mode=study] .disc{animation-duration:14s}
:root[data-mode=study] .hero .bg{opacity:.35}
:root[data-mode=night]{color-scheme:dark;--bg:#0a0b11;--ink:#eceef6;--mute:#989eb4;--line:#22263a;--side:#11131d;--soft:#1b2042;--pri:#8a9bff;--onpri:#0a0b11;--deck:#121838;--plate:#1b2352;--hot:#ff8a5c;--onhot:#1a0c06;--danger:#ff7a62}
:root[data-mode=pastel]{color-scheme:light;--bg:#fff8fb;--ink:#2b2234;--mute:#7b6c88;--line:#f0dfea;--side:#fbeef5;--soft:#f1e5ff;--pri:#7d58c8;--onpri:#fff;--deck:#7456bf;--plate:#8467cc;--hot:#ff7fa6;--onhot:#2b0f19;--danger:#c63a5a}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mo{display:grid;gap:8px;text-align:left;padding:10px;border-radius:16px;border:2px solid var(--line);background:var(--bg)}
.mo.on{border-color:var(--pri)}
.mo .pv{display:grid;grid-template-columns:1.4fr 1fr;height:76px;border-radius:10px;overflow:hidden}
.mo .pv i{position:relative;display:block}
.mo .pv i+i::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:repeating-radial-gradient(circle,#121318 0 1.2px,#22232c 1.2px 2.4px);box-shadow:0 0 0 2px #0b0c10}
.mo .pv i+i::before{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--h);z-index:1}
.mo .pv i:first-child::before{content:"";position:absolute;left:10px;top:12px;width:46%;height:8px;border-radius:4px;background:var(--k);opacity:.8}
.mo .pv i:first-child::after{content:"";position:absolute;left:10px;top:30px;width:30%;height:22px;border-radius:6px;background:var(--a)}
.md:has(.modes) [data-m="x"]{display:none}
.mo b{font-size:16px}
.mo span{font-size:13px;color:var(--mute);margin-top:-6px}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.i{width:22px;height:22px;flex:none;display:block}
.i.f{fill:currentColor}
.i.s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.disp{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--dw,368px)}
#side{display:none!important}
#side{background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:24px 14px;display:flex;flex-direction:column;gap:4px}
.brand{font-size:30px;line-height:1.05;margin:0 10px 18px;display:flex;align-items:center;gap:10px}
.dot{width:30px;height:30px;border-radius:50%;background:repeating-radial-gradient(circle,#15161c 0 1.5px,#2b2d37 1.5px 3px);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--hot)}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;border-radius:12px;text-align:left;font-weight:500}
.nav:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nav.on{background:var(--pri);color:var(--onpri)}
.nav .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .c{font-size:13px;opacity:.75;font-variant-numeric:tabular-nums}
.sh{display:flex;align-items:center;justify-content:space-between;margin:18px 0 2px 12px;font-size:14px;color:var(--mute);font-weight:500}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;position:relative}
.ib:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
.sw{width:22px;height:22px;border-radius:6px;flex:none;overflow:hidden}
.foot{margin:auto 0 0;padding:18px 10px 0;font-size:13px;color:var(--mute);display:grid;gap:6px}
#sync2{display:flex;margin:12px clamp(16px,3vw,36px) 0;padding:8px 14px;border-radius:12px;background:var(--side);border:1px solid var(--line);font-size:13px;color:var(--mute);gap:4px 14px;align-items:center;flex-wrap:wrap}
.st{display:flex;gap:8px;align-items:baseline}
.sdot{width:8px;height:8px;border-radius:50%;background:#1fa463;flex:none;transform:translateY(-1px)}
.sdot.busy{background:#f0a800}
.sdot.off{background:#9ca2b5}
.keep{display:flex;align-items:center;gap:8px;min-height:36px;color:var(--ink);font-size:13px;cursor:pointer}
.keep input{width:18px;height:18px;accent-color:var(--pri);margin:0}
.cb{position:absolute;left:8px;bottom:8px;z-index:2;width:28px;height:28px;border-radius:50%;background:#000000b3;color:#fff;display:grid;place-items:center}
.cb .i{width:16px;height:16px}
.imp{margin-top:16px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap}
.btn.p{background:var(--pri);color:var(--onpri)}
.btn.g{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.btn.h{background:var(--hot);color:var(--onhot)}
.btn.d{background:var(--danger);color:#fff}
.btn:hover:not(:disabled){filter:brightness(1.07)}
#main{overflow-y:auto;position:relative}
#chips{display:flex;gap:8px;overflow-x:auto;padding:14px clamp(16px,3vw,36px) 0;scrollbar-width:none;align-items:center}
.tb{display:flex;align-items:center;gap:8px;font-size:24px;padding-right:12px;white-space:nowrap;flex:none;position:sticky;left:0;z-index:2;background:var(--bg);box-shadow:10px 0 10px -6px var(--bg);align-self:stretch}
.tb .dot{width:24px;height:24px}
.tb .dot::after{inset:8px}
#chips button{flex:none;min-height:42px;padding:0 16px;border-radius:999px;background:var(--side);border:1px solid var(--line);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
#chips button.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
#chips .sw{width:16px;height:16px;border-radius:4px}
.head{padding:28px clamp(16px,3vw,36px) 14px;display:grid;gap:14px}
.head:empty{display:none}
.ht{display:flex;align-items:flex-end;gap:14px 20px;flex-wrap:wrap;justify-content:space-between}
.head h1{margin:0;font-size:clamp(34px,4vw,48px);line-height:1.05;text-wrap:balance}
.meta{color:var(--mute);font-size:15px;margin-top:6px}
.memo{margin:8px 0 0;color:var(--mute);max-width:60ch;white-space:pre-line}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph{display:grid;grid-template-columns:clamp(120px,16vw,184px) minmax(0,1fr);gap:24px;align-items:end}
.ph .pc{aspect-ratio:1;border-radius:14px;overflow:hidden;box-shadow:0 14px 26px -14px #0009}
.ph .acts{margin-top:16px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.srch{flex:1 1 220px;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--mute)}
.srch input{border:0;outline:0;background:none;width:100%;font-size:16px;color:var(--ink)}
.srch:focus-within{border-color:var(--pri)}
select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
.seg{display:flex;background:var(--side);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{min-height:38px;padding:0 14px;border-radius:9px;font-size:15px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--pri);box-shadow:0 1px 3px #0002}
.note{font-size:14px;color:var(--mute);margin:0}
#list{padding:8px clamp(16px,3vw,36px) 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 18px}
.card{position:relative;cursor:pointer}
.sl{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;box-shadow:0 1px 0 #0000000f,0 8px 16px -10px #0007;transition:transform .2s}
.card:hover .sl{transform:translateY(-3px)}
.card.on .sl{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--pri)}
.cv{width:100%;height:100%;object-fit:cover;display:block}
.gen{width:100%;height:100%;position:relative;background:var(--c1);overflow:hidden;color:#fff;padding:11%;container-type:size}
.gen::before{content:"";position:absolute;width:88%;aspect-ratio:1;border-radius:50%;right:-26%;bottom:-26%;background:var(--c2)}
.gen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:repeating-linear-gradient(0deg,#ffffff30 0 3px,transparent 3px 7px)}
.gen b{position:relative;z-index:1;display:block;font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:48px;font-size:42cqw;line-height:.9}
.col4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:100%;height:100%}
.col4>*{overflow:hidden}
.th{overflow:hidden;border-radius:4px;flex:none}
.vb{position:absolute;left:8px;top:8px;z-index:2;background:#000b;color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;display:flex;align-items:center;gap:4px}
.vb .i{width:14px;height:14px}
.pp{position:absolute;right:8px;bottom:8px;width:46px;height:46px;border-radius:50%;background:var(--hot);color:var(--onhot);display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:.2s;box-shadow:0 6px 12px -4px #0006}
.card:hover .pp,.card.on .pp{opacity:1;transform:none}
@media(hover:none){.pp{display:none}.card.on .pp{display:grid}}
.ct{display:flex;gap:2px;margin-top:10px;align-items:flex-start}
.ct div{flex:1;display:grid}
.ct b,.ti b{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct span,.ti span{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{width:40px;height:44px;margin:-8px -10px 0 0;display:grid;place-items:center;color:var(--mute);border-radius:10px}
.more:hover{background:var(--soft)}
.tag{display:inline-block;font:700 12px/1.6 "Noto Sans KR",sans-serif;padding:0 8px;border-radius:999px;background:var(--hot);color:var(--onhot);vertical-align:8px;margin-left:10px}
.rows{display:grid;gap:2px}
.row{display:grid;grid-template-columns:28px 52px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:6px 6px 6px 4px;border-radius:12px;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.row.on{background:var(--soft)}
.row.on .ti b{color:var(--pri)}
.row .n{text-align:right;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.row .th{width:52px;height:52px}
.ti{display:grid}
.du{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.ra{display:flex;color:var(--mute)}
.ra .ib{width:40px}
.empty{border:2px dashed var(--line);border-radius:18px;padding:44px 24px;text-align:center;color:var(--mute);display:grid;gap:12px;justify-items:center}
.hero{position:relative;overflow:hidden;border-radius:24px;color:#fff;display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(18px,3vw,32px);align-items:center;padding:clamp(18px,3vw,32px);background:var(--hc);margin-top:20px}
.hero .bg{position:absolute;inset:-25%;width:150%;height:150%;object-fit:cover;filter:blur(42px) saturate(1.3);opacity:.85}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,#000000a0,#00000040)}
.hero>*:not(.bg){position:relative;z-index:1}
.hc{width:clamp(130px,17vw,210px);aspect-ratio:1;border-radius:8px;overflow:hidden;box-shadow:0 22px 34px -16px #000d}
.hx{display:grid;gap:4px}
.hero h1{font-size:clamp(32px,4.2vw,52px);line-height:1.05;margin:0;text-wrap:balance}
.hero p{margin:0;color:#ffffffdd}
.hero .acts{margin-top:14px}
.hero .btn.g{background:#ffffff2b;color:#fff}
.stats{display:flex;gap:6px 22px;flex-wrap:wrap;margin-top:16px;font-size:14px;color:#ffffffcc}
.stats b{font-size:18px;color:#fff;margin-right:3px}
.sec{padding-top:30px}
.sec h2{font-size:28px;margin:0 0 14px;line-height:1.1;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2 button{font:500 14px "Noto Sans KR",sans-serif;color:var(--pri);min-height:44px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:18px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory}
.strip>*{scroll-snap-align:start}
.pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 18px}
.pt{text-align:left;display:grid;gap:8px;align-content:start}
.pt .pc{aspect-ratio:1;border-radius:14px;overflow:hidden;box-shadow:0 10px 20px -12px #0008;transition:transform .2s}
.pt:hover .pc{transform:translateY(-3px)}
.pt b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt span{font-size:13px;color:var(--mute);margin-top:-6px}
.pt .nw{display:grid;place-items:center;border:2px dashed var(--line);box-shadow:none;color:var(--mute)}
.alw{position:relative;margin-right:13%}
.alw .pc{position:relative;z-index:1}
.alw::before{content:"";position:absolute;top:4%;right:-13%;width:92%;height:92%;border-radius:50%;background:repeating-radial-gradient(circle,#121318 0 1.4px,#23242d 1.4px 2.8px);box-shadow:0 8px 16px -8px #000a;transition:transform .35s ease}
.pt:hover .alw::before{transform:translateX(9%)}
.als{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.strip.als{grid-auto-columns:170px}
.door{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}
.dr{position:relative;overflow:hidden;border-radius:20px;min-height:132px;padding:18px 20px;color:#fff;text-align:left;display:grid;align-content:space-between;gap:10px}
.dr b{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400;font-size:clamp(24px,2.6vw,32px);line-height:1.05;position:relative;z-index:1}
.dr span{font-size:14px;color:inherit;opacity:.85;position:relative;z-index:1}
.dr .i{position:absolute;right:-14px;bottom:-18px;width:112px;height:112px;opacity:.22;stroke-width:1.6}
.dr:hover{filter:brightness(1.06)}
.dr.d1{background:var(--deck)}
.dr.d2{background:var(--hot);color:var(--onhot)}
.dr.d3{background:var(--ink);color:var(--bg)}
.hs{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--side);color:var(--mute);margin-top:14px}
.hs input{border:0;outline:0;background:none;width:100%;font-size:16px;color:var(--ink)}
.hs:focus-within{border-color:var(--pri);background:var(--bg)}
@media(max-width:520px){.door{grid-template-columns:1fr}.dr{min-height:92px;grid-auto-flow:column;align-items:center}}
.card.chosen .sl::after{content:"";position:absolute;inset:0;z-index:2;border-radius:6px;box-shadow:inset 0 0 0 4px var(--pri);background:color-mix(in srgb,var(--pri) 22%,transparent)}
.sn{position:absolute;right:8px;top:8px;z-index:3;width:32px;height:32px;border-radius:50%;border:2px solid #fff;background:#00000059;color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;box-shadow:0 2px 8px #0007}
.card.chosen .sn{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.grid.editing .pp,.grid.editing .more{display:none}
.grid.editing .card:hover .sl{transform:none}
#selbar{position:sticky;bottom:14px;z-index:15;margin:0 clamp(16px,3vw,36px) 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 10px 10px 18px;border-radius:18px;background:var(--ink);color:var(--bg);box-shadow:0 18px 36px -14px #000b}
#selbar[hidden]{display:none}
#selbar .cnt{flex:1 1 160px;font-weight:700}
#selbar .cnt small{font-weight:400;opacity:.75;margin-left:6px;font-size:14px}
#selbar .btn.g{background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}
#selbar .ib{color:var(--bg)}
.btn.on{background:var(--pri);color:var(--onpri)}
.hist{display:grid;gap:10px}
.hist.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.hi{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px;border-radius:16px;background:var(--side);border:1px solid var(--line);cursor:pointer}
.hi:hover{border-color:var(--pri)}
.hi.on{border-color:var(--pri);background:var(--soft)}
.hc4{width:72px;height:72px;border-radius:10px;overflow:hidden}
.hi b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi .sub,.hi .tl{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi .ha{display:flex;color:var(--mute)}
@media(max-width:760px){#selbar{bottom:92px}}
.qr,.rows[data-sort] .row{position:relative;isolation:isolate;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.qr{--rowbg:var(--deck)}
.qr.now{--rowbg:color-mix(in srgb,#fff 18%,var(--deck))}
.rows .row{--rowbg:var(--bg)}
.rows .row.on{--rowbg:var(--soft)}
.rows[data-sort] .hd{width:40px;color:var(--mute)}
.lift{box-shadow:0 14px 28px -10px #000c;z-index:3;cursor:grabbing;transform:scale(1.015)}
.rows .row.lift{background:var(--side)}
.swiping{background:var(--danger)!important;overflow:hidden}
.swiping::before{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;background:var(--rowbg);transform:translateX(var(--sx,0px))}

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{if(!isFinite(t)||t<0)t=0;t=Math.round(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const fmtSum=s=>{const m=Math.round(s/60);if(s>0&&m<1)return '1분 미만';return m<60?m+'분':Math.floor(m/60)+'시간 '+(m%60)+'분'};

/* ---- sample tracks synthesised on the spot, so the app works before any file is added ---- */
function makeWav(seq,bass,bpm,decay){const sr=22050,step=30/bpm,len=seq.length*step*4,n=Math.floor(sr*len),v=new DataView(new ArrayBuffer(44+n*2));
const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
const sn=Math.floor(step*sr),hz=m=>440*2**((m-69)/12),TAU=Math.PI*2;
for(let i=0;i<n;i++){const k=Math.floor(i/sn),p=(i%sn)/sr,m=seq[k%seq.length];let x=0;
if(m!=null){const f=hz(m),e=Math.exp(-p*decay);x+=Math.sin(TAU*f*p)*e*.5+Math.sin(TAU*f*2*p)*e*.12}
const bp=(i%(sn*4))/sr,bf=hz(bass[Math.floor(i/(sn*4))%bass.length]);x+=Math.sin(TAU*bf*bp)*Math.exp(-bp*2)*.34;
const t=i/sr,fade=Math.min(1,t/.4,(len-t)/1.4);v.setInt16(44+i*2,Math.max(-1,Math.min(1,x*fade*.8))*32767,true)}
return {blob:new Blob([v],{type:'audio/wav'}),dur:len}}

D.forEach(([id,title,seq,bass,bpm,dc],i)=>{try{const w=makeWav(seq,bass,bpm,dc);S.tracks.push({id,title,artist:'플리 창고 합성음',album:'창고 세션',no:i+1,year:'2026',duration:w.dur,added:3-i,blob:w.blob,art:null,kind:'audio',demo:true})}catch(e){}})}

/* ---- ID3 tags: title, artist, album, cover; Korean EUC-KR tags decoded too ---- */
function dec(enc,u){try{let s;if(enc===1){if(u[0]===0xFE&&u[1]===0xFF)s=new TextDecoder('utf-16be').decode(u.subarray(2));else s=new TextDecoder('utf-16le').decode(u[0]===0xFF&&u[1]===0xFE?u.subarray(2):u)}else if(enc===2)s=new TextDecoder('utf-16be').decode(u);else if(enc===3)s=new TextDecoder('utf-8').decode(u);else s=u.some(x=>x>127)?new TextDecoder('euc-kr').decode(u):String.fromCharCode(...u);return s.split('\0')[0].trim()}catch(e){return ''}}
async function readTags(file){const out={};try{const h=new Uint8Array(await file.slice(0,10).arrayBuffer());if(h[0]!==73||h[1]!==68||h[2]!==51)return out;
const ver=h[3],flags=h[5],size=(h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9];const b=new Uint8Array(await file.slice(10,10+size).arrayBuffer());let p=0;
if(flags&0x40&&ver>=3)p=ver===4?((b[0]<<21)|(b[1]<<14)|(b[2]<<7)|b[3]):((b[0]<<24)|(b[1]<<16)|(b[2]<<8)|b[3])+4;
const il=ver===2?3:4,hl=ver===2?6:10;
while(p+hl<=b.length){const id=String.fromCharCode(...b.subarray(p,p+il));if(!/^[A-Z0-9]+$/.test(id))break;
let sz=ver===2?(b[p+3]<<16)|(b[p+4]<<8)|b[p+5]:ver===4?(b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7]:b[p+4]*16777216+(b[p+5]<<16)+(b[p+6]<<8)+b[p+7];
if(sz<=0)break;const d=b.subarray(p+hl,p+hl+sz);p+=hl+sz;
const key={TIT2:'title',TT2:'title',TPE1:'artist',TP1:'artist',TALB:'album',TAL:'album',TRCK:'no',TRK:'no',TYER:'year',TDRC:'year',TYE:'year'}[id];
if(key&&!out[key])out[key]=dec(d[0],d.subarray(1));
else if((id==='APIC'||id==='PIC')&&!out.art){const enc=d[0];let i=1,mime;
if(id==='PIC'){mime='image/'+String.fromCharCode(...d.subarray(1,4)).toLowerCase();i=4}else{while(i<d.length&&d[i]!==0)i++;mime=String.fromCharCode(...d.subarray(1,i))||'image/jpeg';i++}
i++;if(enc===1||enc===2){while(i+1<d.length&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2}else{while(i<d.length&&d[i]!==0)i++;i++}
if(!mime.includes('/'))mime='image/'+mime;mime=mime.replace('jpg','jpeg');if(i<d.length)out.art=new Blob([d.slice(i)],{type:mime})}}}catch(e){}return out}
/* duration for audio; for video also a frame grabbed as the sleeve */
function probe(blob,vid){return new Promise(res=>{const el=document.createElement(vid?'video':'audio'),u=URL.createObjectURL(blob);let fin=false;
const dur=()=>isFinite(el.duration)?el.duration:0;const done=r=>{if(fin)return;fin=true;URL.revokeObjectURL(u);res(r)};
el.preload='metadata';el.muted=true;if(vid)el.playsInline=true;
el.onloadedmetadata=()=>{if(!vid||!el.videoWidth){done({duration:dur(),kind:'audio'});return}
el.onseeked=()=>{try{const c=document.createElement('canvas'),s=Math.min(1,480/el.videoWidth);c.width=Math.round(el.videoWidth*s);c.height=Math.round(el.videoHeight*s);c.getContext('2d').drawImage(el,0,0,c.width,c.height);c.toBlob(b=>done({duration:dur(),kind:'video',thumb:b}),'image/jpeg',.82)}catch(e){done({duration:dur(),kind:'video'})}};
el.currentTime=Math.min(1.5,dur()/3||0)};
el.onerror=()=>done({duration:0,kind:vid?'video':'audio'});setTimeout(()=>done({duration:dur(),kind:vid&&el.videoWidth?'video':'audio'}),10000);el.src=u})}
async function shrink(f){try{const u=URL.createObjectURL(f),im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=u});
const side=Math.min(im.naturalWidth,im.naturalHeight),out=Math.min(640,side),c=document.createElement('canvas');c.width=c.height=out;
c.getContext('2d').drawImage(im,(im.naturalWidth-side)/2,(im.naturalHeight-side)/2,side,side,0,0,out,out);URL.revokeObjectURL(u);
return await new Promise(r=>c.toBlob(b=>r(b||f),'image/jpeg',.86))}catch(e){return f}}

function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setQueue(ids,first){if(S.shuffle){const rest=shuffled(ids.filter(x=>x!==first));S.queue=first?[first,...rest]:rest;S.qi=0}else{S.queue=ids.slice();S.qi=Math.max(0,first?ids.indexOf(first):0)}}
function playCtx(ids,first,name,shuf){ids=ids.filter(getT);if(!ids.length)return;if(shuf){S.shuffle=true;first=null;savePrefs()}S.ctx=ids;S.ctxName=name;setQueue(ids,first);load(true)}
function load(auto){const t=getT(S.queue[S.qi]);if(!t){audio.pause();renderDeck();syncOn();return}
if(S.loaded!==t.id){let src;if(t.blob){if(curUrl)URL.revokeObjectURL(curUrl);curUrl=URL.createObjectURL(t.blob);src=curUrl}else if(t.enc==='raw'&&t.chunks?.length===1&&navigator.onLine)src='/_blob/'+t.chunks[0];
else{audio.pause();renderDeck();syncOn();if(!navigator.onLine||!t.chunks?.length){toast('아직 이 기기에 없는 곡이에요. 인터넷에 연결되면 내려받아요');return}toast('클라우드에서 내려받는 중…');
pullFile(t).then(()=>{if(S.queue[S.qi]===t.id){S.loaded=null;load(auto)}markLocal(t)}).catch(()=>toast('내려받지 못했어요. 인터넷 연결을 확인해 주세요'));return}
audio.src=src;S.loaded=t.id;counted=null;meta(t)}
if(auto){const pr=audio.play();if(pr)pr.catch(()=>renderDeck());if(t.kind==='video'&&matchMedia('(max-width:760px)').matches)$('#deck').classList.add('open')}renderDeck();syncOn()}
function resetQueue(first){const ids=libList().map(t=>t.id);S.ctx=ids;S.ctxName='파일 창고';setQueue(ids,ids.includes(first)?first:ids[0]);S.loaded=null;load(false)}
function toggle(){if(!getT(S.queue[S.qi]))resetQueue();if(!getT(S.queue[S.qi]))return;if(S.loaded!==S.queue[S.qi]){load(true);return}if(audio.paused){const pr=audio.play();if(pr)pr.catch(()=>{})}else audio.pause()}
function next(auto){if(S.qi+1<S.queue.length){S.qi++;load(true)}else if(S.repeat==='all'&&S.queue.length){if(S.shuffle)S.queue=shuffled(S.queue);S.qi=0;load(true)}else if(auto){audio.pause();audio.currentTime=0;renderDeck();syncOn()}else toast('마지막 곡이에요')}
function prev(){if(audio.currentTime>3||S.qi<=0){audio.currentTime=0;return}S.qi--;load(true)}
function clickTrack(id,item){if(id===S.queue[S.qi]&&S.loaded===id){toggle();return}const box=item?.closest('[data-list]');if(box)playCtx(homeLists[box.dataset.list]||[id],id,'홈');else playCtx(viewIds(),id,vname())}
function meta(t){try{if(!('mediaSession' in navigator))return;const a=artOf(t);navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album||'플리 창고',artwork:a?[{src:a,sizes:'512x512',type:(t.cover||t.art)?.type||'image/jpeg'}]:[]})}catch(e){}}
try{const ms=navigator.mediaSession;if(ms){ms.setActionHandler('play',()=>toggle());ms.setActionHandler('pause',()=>audio.pause());ms.setActionHandler('nexttrack',()=>next(false));ms.setActionHandler('previoustrack',()=>prev())}}catch(e){}

async function importFiles(list){const isV=f=>/^video\//.test(f.type)||/\.(mp4|m4v|mov|webm)$/i.test(f.name);
const files=[...list].filter(f=>/^(audio|video)\//.test(f.type)||/\.(mp3|m4a|wav|ogg|flac|aac|mp4|m4v|mov|webm)$/i.test(f.name));if(!files.length){toast('MP3나 MP4 파일을 골라 주세요');return}
try{navigator.storage?.persist?.()}catch(e){}
const wasDemo=noReal(),pl=S.playlists.find(p=>p.id===S.view)||null,newIds=[];let n=0,i=0;
for(const f of files){i++;toast(`${i} / ${files.length} 들여오는 중…`);const vid=isV(f),tg=vid?{}:await readTags(f),base=f.name.replace(/\.[^.]+$/,'');let title=tg.title,artist=tg.artist;
if(!title){const m=base.split(' - ');if(m.length>1){artist=artist||m[0].trim();title=m.slice(1).join(' - ').trim()}else title=base.trim()}
if(S.tracks.some(t=>!t.demo&&t.title===title&&t.size===f.size))continue;
const pr=await probe(f,vid);
const rec={id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),title,artist:artist||(pr.kind==='video'?'내 영상':'알 수 없는 아티스트'),album:tg.album||(curAl()?.name||''),no:parseInt(tg.no)||0,year:String(tg.year||'').slice(0,4),duration:pr.duration,added:Date.now(),blob:f,art:tg.art||pr.thumb||null,cover:null,kind:pr.kind,size:f.size,mime:f.type||(pr.kind==='video'?'video/mp4':'audio/mpeg'),ver:Date.now(),synced:false};
await saveTrack(rec);S.tracks.push(rec);n++;newIds.push(rec.id);enqueue('t'+rec.id,()=>pushTrack(rec));if(pl)pl.ids.push(rec.id)}
if(pl)savePl();if(wasDemo&&n){audio.pause();resetQueue()}renderAll();
toast(n?`${n}개가 창고${pl?'와 '+pl.name:''}에 들어왔어요`+(files.length>n?` (중복 ${files.length-n}개 건너뜀)`:''):'이미 창고에 있는 파일이에요');return newIds}
async function delTrack(id){const gone=S.tracks.find(t=>t.id===id);if(gone&&!gone.demo)cloudDel('t',id,[...(gone.chunks||[]),gone.artId,gone.coverId].filter(a=>a&&!S.tracks.some(x=>x!==gone&&(x.coverId===a||x.artId===a))));const wasCur=S.queue[S.qi]===id,before=S.queue.slice(0,S.qi).filter(x=>x===id).length;
S.tracks=S.tracks.filter(t=>t.id!==id);S.playlists.forEach(p=>p.ids=p.ids.filter(x=>x!==id));S.queue=S.queue.filter(x=>x!==id);S.ctx=S.ctx.filter(x=>x!==id);S.qi-=before;delete S.stats[id];lsSet('plli-stats',S.stats);
dropUrls(id+'|');if(db){try{await tx('tracks','readwrite',st=>st.delete(id))}catch(e){}}savePl();
if(noReal()){audio.pause();resetQueue()}else if(wasCur){audio.pause();S.loaded=null;if(S.qi>=S.queue.length)S.qi=S.queue.length-1;load(false)}
renderAll();toast('창고에서 지웠어요')}

/* ---- row gestures (재생 목록 and a playlist): drag to reorder (handle, long-press, or mouse drag), swipe left to remove ---- */
let gest=null;
const gRow=t=>t.closest('.ql .qr,.rows[data-sort] .row');
function gScroller(list){return list.closest('#dscroll')||$('#main')}
function gPlace(){const g=gest;let before=null;for(const x of g.list.children){if(x===g.row)continue;const b=x.getBoundingClientRect();if(g.y<b.top+b.height/2){before=x;break}}if(before!==g.row.nextElementSibling){g.list.insertBefore(g.row,before);g.moved=true}}
function gDrag(){const g=gest;clearTimeout(g.timer);g.mode='drag';if(g.q)qdrag=true;g.row.classList.add('lift');try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}
const sc=gScroller(g.list);const tick=()=>{if(!gest||gest.mode!=='drag')return;const r=sc.getBoundingClientRect(),d=g.y<r.top+70?-12:g.y>r.bottom-70?12:0;if(d){sc.scrollTop+=d;gPlace()}g.raf=requestAnimationFrame(tick)};g.raf=requestAnimationFrame(tick)}
function gOff(){removeEventListener('pointermove',gMove);removeEventListener('pointerup',gEnd);removeEventListener('pointercancel',gEnd)}
document.addEventListener('pointerdown',e=>{if(gest||(e.button&&e.button>0))return;const row=gRow(e.target);if(!row)return;const onHandle=!!e.target.closest('[data-drag]');
if(e.target.closest('button')&&!onHandle)return;if(row.classList.contains('lift'))return;
gest={row,list:row.parentElement,q:!!row.closest('.ql'),x0:e.clientX,y0:e.clientY,y:e.clientY,mode:null,moved:false,mouse:e.pointerType==='mouse',timer:0,raf:0};
addEventListener('pointermove',gMove);addEventListener('pointerup',gEnd);addEventListener('pointercancel',gEnd);
if(onHandle){e.preventDefault();gDrag();return}
if(!gest.mouse)gest.timer=setTimeout(()=>{if(gest&&!gest.mode)gDrag()},380)});
document.addEventListener('touchmove',e=>{if(gest&&(gest.mode==='drag'||gest.mode==='swipe'))e.preventDefault()},{passive:false});
function gMove(e){const g=gest;if(!g)return;const dx=e.clientX-g.x0,dy=e.clientY-g.y0;g.y=e.clientY;
if(!g.mode){if(dx<-12&&Math.abs(dx)>Math.abs(dy)*1.4){clearTimeout(g.timer);g.mode='swipe';if(g.q)qdrag=true;g.row.classList.add('swiping')}
else if(g.mouse&&Math.abs(dy)>6&&Math.abs(dy)>Math.abs(dx))gDrag();else if(Math.hypot(dx,dy)>9)clearTimeout(g.timer);}
if(g.mode==='swipe')g.row.style.setProperty('--sx',Math.min(0,dx)+'px');else if(g.mode==='drag')gPlace()}
function gEnd(e){const g=gest;if(!g)return;gOff();clearTimeout(g.timer);cancelAnimationFrame(g.raf);gest=null;
if(!g.mode)return;noClick=true;setTimeout(()=>noClick=false,80);
if(g.mode==='drag'){g.row.classList.remove('lift');qdrag=false;qDirty=false;if(g.moved)gReorder(g);else if(g.q)renderDeck();return}
const w=g.row.offsetWidth,dx=parseFloat(g.row.style.getPropertyValue('--sx'))||0,gone=e.type!=='pointercancel'&&dx<-Math.max(90,w*.33);
g.row.classList.add('snap');g.row.style.setProperty('--sx',(gone?-w:0)+'px');
setTimeout(()=>{g.row.classList.remove('swiping','snap');g.row.style.removeProperty('--sx');qdrag=false;qDirty=false;if(gone)gRemove(g);else if(g.q)renderDeck()},200)}
function gReorder(g){if(g.q){const order=[...g.list.children].map(x=>+x.dataset.qi),old=S.queue;S.qi=order.indexOf(S.qi);S.queue=order.map(i=>old[i]);S.ctx=S.queue.slice();renderDeck();toast('순서를 바꿨어요');return}
const p=curPl();if(!p||p.demo)return;const shown=[...g.list.children].map(x=>x.dataset.id),rest=p.ids.filter(id=>!shown.includes(id));p.ids=[...shown,...rest];savePl();renderList();toast('플리 순서를 바꿨어요')}
function gRemove(g){if(g.q){const i=+g.row.dataset.qi;if(i===S.qi){renderDeck();toast('지금 재생 중인 곡은 뺄 수 없어요');return}
const id=S.queue[i],qBefore=S.queue.slice();S.queue.splice(i,1);if(i<S.qi)S.qi--;S.ctx=S.queue.slice();renderDeck();
toast(`'${getT(id)?.title||'곡'}'을 재생 목록에서 뺐어요`,'되돌리기',()=>{const cur=S.queue[S.qi];S.queue=qBefore;const k=qBefore.indexOf(cur);S.qi=k>=0?k:0;S.ctx=S.queue.slice();renderDeck()});return}
const p=curPl();if(!p||p.demo)return;const id=g.row.dataset.id,before=p.ids.slice();p.ids=p.ids.filter(x=>x!==id);savePl();renderAll();
toast(`'${getT(id)?.title||'곡'}'을 플리에서 뺐어요`,'되돌리기',()=>{p.ids=before;savePl();renderAll()})}

function closePop(){$('#pop').classList.remove('show')}
function openPop(btn,id){const t=getT(id);if(!t)return;const p=curPl(),pop=$('#pop');
pop.innerHTML=`<div class="lb">${esc(t.title)}</div><button data-p="next">${ic('next')}다음에 재생</button><button data-p="edit">${ic('image')}정보·표지 바꾸기</button><button data-p="album">${ic('album')}앨범에 넣기</button>${curAl()?`<button data-p="unal">${ic('close')}이 앨범에서 빼기</button>`:''}`+(p&&!p.demo?`<hr><button data-p="rm">${ic('close')}이 플리에서 빼기</button>`:'')+(t.demo?'':`<hr><button data-p="del" class="dg">${ic('trash')}창고에서 삭제</button>`);
pop.onclick=ev=>{const b=ev.target.closest('[data-p]');if(!b)return;closePop();const k=b.dataset.p;
if(k==='next')playNextQ(id);else if(k==='edit')editTrack(t);else if(k==='album')albumPick([id],'');else if(k==='unal'){setAlbum([id],'');toast('앨범에서 뺐어요')}else if(k==='add')togglePl(b.dataset.pl,id);else if(k==='newadd')editPl(null,id);else if(k==='rm'){p.ids=p.ids.filter(x=>x!==id);savePl();renderAll();toast('플리에서 뺐어요')}
else if(k==='del')modal('곡 삭제',`<p style="margin:0">'${esc(t.title)}'을(를) 창고에서 지울까요? 모든 플리에서도 빠지고 이 기기에 보관된 파일도 사라져요.</p>`,'삭제',()=>{delTrack(id)},true)};
pop.classList.add('show');const r=btn.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;let x=r.right-w,y=r.bottom+6;x=Math.max(8,Math.min(x,innerWidth-w-8));if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);pop.style.left=x+'px';pop.style.top=y+'px'}

document.addEventListener('click',e=>{if(e.target.closest('#pop')||e.target.closest('#ov'))return;closePop();if(noClick||e.target.closest('[data-drag]'))return;
const a=e.target.closest('[data-act]'),go=e.target.closest('[data-go]');
if(go&&!(a&&go.contains(a))){S.view=go.dataset.go;S.q='';if(S.view!=='lib'){S.editing=false;S.sel=[]}renderAll();$('#main').scrollTop=0;return}
const q=e.target.closest('[data-qi]');if(q&&!(a&&q.contains(a))){S.qi=+q.dataset.qi;load(true);return}
const item=e.target.closest('#list [data-id]'),id=item?.dataset.id;
const hi=e.target.closest('[data-hid]');
if(!a){if(hi){histPlay(hi.dataset.hid);return}if(item){if(S.editing&&S.view==='lib'&&item.classList.contains('card'))toggleSel(id);else clickTrack(id,item)}return}
const p=curPl();
switch(a.dataset.act){
case 'more':openPop(a,id);break;case 'pp':clickTrack(id,item);break;case 'up':move(id,-1);break;case 'dn':move(id,1);break;
case 'import':$('#file').dataset.mode=a.dataset.mode||'';$('#file').click();break;case 'edital':{const al=curAl();if(al)editAlbum(al);break}case 'newpl':editPl(null);break;case 'addto':openPicker();break;case 'editpl':if(p&&!p.demo)editPl(p);break;
case 'kind':S.kind=a.dataset.k;renderHead();renderList();break;
case 'playall':playCtx(viewIds(),null,vname(),false);break;case 'shufall':playCtx(viewIds(),null,vname(),true);break;case 'shufhome':playCtx(shelf().map(t=>t.id),null,'파일 창고',true);break;
case 'delpl':if(p&&!p.demo)modal('플리 삭제',`<p style="margin:0">'${esc(p.name)}' 플리를 지울까요? 곡은 창고에 그대로 남아요.</p>`,'삭제',()=>{S.playlists=S.playlists.filter(x=>x!==p);dropUrls('pl:'+p.id);cloudDel('p',p.id,[p.coverId]);S.view='home';savePl();renderAll()},true);break;
case 'toggle':toggle();break;case 'next':next(false);break;case 'prev':prev();break;
case 'fs':{const v=audio;try{if(v.requestFullscreen)v.requestFullscreen().catch(()=>{if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();else toast('이 화면에서는 전체 화면을 쓸 수 없어요')});else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}catch(err){toast('이 화면에서는 전체 화면을 쓸 수 없어요')}break}
case 'shuf':{S.shuffle=!S.shuffle;const cur=S.queue[S.qi];if(S.ctx.length&&cur){if(S.shuffle){S.queue=[cur,...shuffled(S.ctx.filter(x=>x!==cur))];S.qi=0}else{S.queue=S.ctx.slice();S.qi=Math.max(0,S.queue.indexOf(cur))}}savePrefs();renderDeck();toast(S.shuffle?'셔플 켬':'셔플 끔');break}
case 'rep':S.repeat={off:'all',all:'one',one:'off'}[S.repeat];savePrefs();renderDeck();toast({off:'반복 끔',all:'전체 반복',one:'한 곡 반복'}[S.repeat]);break;
case 'opendeck':if(isPhone())$('#deck').classList.add('open');else setMode('mid');break;case 'edit':S.editing=!S.editing;if(!S.editing)S.sel=[];renderHead();renderList();break;
case 'selall':for(const t of libList())if(!S.sel.includes(t.id))S.sel.push(t.id);syncSel();break;
case 'selclear':S.sel=[];syncSel();break;
case 'seldone':S.editing=false;S.sel=[];renderHead();renderList();break;
case 'selplay':case 'selshuf':{let ids=S.sel.filter(getT);if(!ids.length)break;if(a.dataset.act==='selshuf')ids=shuffled(ids);addHist(ids);S.editing=false;S.sel=[];playExact(ids,'즉석 플리');renderAll();toast('바로 듣는 중 · 기록에 남겼어요');break}
case 'hplay':if(hi)histPlay(hi.dataset.hid);break;
case 'hdel':if(hi){const k=hi.dataset.hid;S.hist=S.hist.filter(h=>h.id!==k);S.histGone.push(k);saveHist();renderList();if(S.view==='hist')renderHead();toast('기록에서 지웠어요')}break;
case 'mode':if(a.dataset.m)setMode(a.dataset.m);else pickMode();break;
case 'dtopscroll':$('#dscroll').scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});break;
case 'qrm':{const i=+q.dataset.qi;S.queue.splice(i,1);if(i<S.qi)S.qi--;S.ctx=S.queue.slice();renderDeck();toast('재생 목록에서 뺐어요');break}
case 'qshuf':S.queue=[...S.queue.slice(0,S.qi+1),...shuffled(S.queue.slice(S.qi+1))];S.ctx=S.queue.slice();renderDeck();toast('다음 곡들을 섞었어요');break;
case 'qclear':S.queue=S.queue.slice(0,S.qi+1);S.ctx=S.queue.slice();renderDeck();toast('다음 곡을 비웠어요');break;
case 'qsave':editPl(null,null,[...new Set(S.queue.filter(getT))]);break;case 'closedeck':$('#deck').classList.remove('open');break}});
const goSearch=v=>{S.view='lib';S.kind='all';S.q=v;renderAll();$('#main').scrollTop=0;const q=$('#q');if(q){q.focus();q.setSelectionRange(v.length,v.length)}};
$('#main').addEventListener('keydown',e=>{if(e.target.id==='hq'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();goSearch(e.target.value.trim())}});
$('#main').addEventListener('search',e=>{if(e.target.id==='hq'&&e.target.value.trim())goSearch(e.target.value.trim())},true);
$('#main').addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;renderList()}});
$('#main').addEventListener('change',e=>{if(e.target.id==='asort'){S.asort=e.target.value;renderList();return}if(e.target.id==='sort'){S.sort=e.target.value;savePrefs();renderList()}});
$('#file').addEventListener('change',e=>{const mode=e.target.dataset.mode;e.target.dataset.mode='';importFiles(e.target.files).then(ids=>{if(mode==='album'&&ids&&ids.length){const t0=getT(ids[0]);albumPick(ids,ids.every(id=>akey(getT(id)?.album)===akey(t0?.album))?(t0?.album||''):'',true)}});e.target.value=''});
const sk=$('#seek');sk.addEventListener('input',()=>{seeking=true;const d=audio.duration||0;$('#tc').textContent=fmt(d*sk.value/1000);sk.style.setProperty('--p',sk.value/10+'%')});
sk.addEventListener('change',()=>{if(audio.duration)audio.currentTime=audio.duration*sk.value/1000;seeking=false;updTime()});
const vol=$('#vol');const setV=()=>vol.style.setProperty('--p',vol.value+'%');
try{audio.volume=.5;const can=audio.volume===.5;audio.volume=typeof prefs.vol==='number'?prefs.vol:1;if(!can)$('#volw').style.display='none'}catch(e){}
vol.value=Math.round(audio.volume*100);setV();vol.addEventListener('input',()=>{audio.volume=vol.value/100;setV();savePrefs()});
let dc=0;const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
addEventListener('dragenter',e=>{if(hasFiles(e)){dc++;$('#drop').classList.add('show')}});
addEventListener('dragleave',()=>{dc=Math.max(0,dc-1);if(!dc)$('#drop').classList.remove('show')});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;$('#drop').classList.remove('show');if(e.dataTransfer?.files?.length)importFiles(e.dataTransfer.files)});
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#ov').classList.contains('show')||$('#pop').classList.contains('show')){closePop();closeModal();return}if(S.editing){S.editing=false;S.sel=[];renderHead();renderList();return}$('#deck').classList.remove('open');if(S.deck==='full'&&!isPhone())setMode('mid');return}if($('#ov').classList.contains('show')||e.target.matches('input,select,textarea'))return;
if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowRight'&&e.shiftKey)next(false);else if(e.key==='ArrowLeft'&&e.shiftKey)prev()});
document.querySelectorAll('[data-ic]').forEach(el=>el.insertAdjacentHTML('afterbegin',ic(el.dataset.ic)));
addEventListener('resize',closePop);
$('#grip').addEventListener('pointerdown',startDrag);$('#pull').addEventListener('pointerdown',startDrag);applyMode();
try{const io=new IntersectionObserver(([en])=>$('#deck').classList.toggle('scrolled',!en.isIntersecting||en.intersectionRatio<.3),{root:$('#dscroll'),threshold:[0,.3,.6,1]});io.observe($('#plate'))}catch(e){}

try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window.__rl){window.__rl=1;location.reload()}});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(g=>g.update()).catch(()=>{})}}catch(e){}
(async()=>{makeDemos();db=await openDB();
if(db){try{const all=await tx('tracks','readonly',st=>st.getAll());S.tracks.push(...(all||[]).map(t=>({kind:'audio',cover:null,...t})));const pl=await tx('kv','readonly',st=>st.get('playlists'));S.playlists=Array.isArray(pl)?pl:[];S.playlists.forEach(p=>{if(p.synced)p._sig=plSig(p)})}catch(e){S.persist=false}}
else{S.persist=false;S.playlists=ls('plli-pl',[])}
renderSide();renderHead();resetQueue(prefs.last);renderList();connect()})();
}
</script>
